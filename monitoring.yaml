# Metrics declared by larena/queue. Registered into larena/monitoring's MetricCatalog by QueueServiceProvider
# only when larena/monitoring is installed; queue never depends on it.
metrics:
  # One durable job run (claim to finish). job_type is the registered job type code; outcome ok, error
  # (failed result or exception), timeout or rejected (job type not registered, or cancelled while running);
  # a run whose handler answered «not yet» (deferred, rescheduled without spending an attempt) is outcome
  # skipped with reason deferred.
  queue.job:
    type: duration
    tags: [job_type]
    thresholds: { p95_ms: 30000, error_rate: 0.05 }
    retention: { raw: 7d, aggregate: 90d }
  # Time a job waited from becoming available (available_at, or created_at when later) until a worker took it.
  queue.wait:
    type: duration
    tags: [job_type]
    thresholds: { p95_ms: 60000 }
    retention: { raw: 7d, aggregate: 90d }
